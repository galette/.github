name: 'Release a Galette plugin'
description: 'Build a plugin archive with its own bin/release and publish it as a GitHub release'
author: 'Galette Team'

inputs:
  version:
    description: 'Tag to release. Leave empty to build a nightly instead.'
    required: false
    default: ''
  nightly-branch:
    description: 'Branch a nightly is built from. bin/release -n reads the local develop branch, so a plugin living on another branch needs it aliased to develop after checkout.'
    required: false
    default: 'develop'
  nightly-tag:
    description: 'Tag carrying the rolling nightly release. Only worth changing when the default name cannot be used on a repository, for instance because a deleted immutable release burnt it.'
    required: false
    default: 'nightly'
  php-version:
    description: 'PHP version used to install the plugin Composer dependencies'
    required: false
    default: '8.3'
  php-extensions:
    description: 'PHP extensions needed to install the plugin Composer dependencies'
    required: false
    default: 'sodium'
  attest:
    description: 'Attach a signed build provenance attestation to the archive'
    required: false
    default: 'true'
  dry-run:
    description: 'Build the archive and upload it as a workflow artifact, publish nothing'
    required: false
    default: 'false'
  token:
    description: 'Token used to publish the release'
    required: false
    default: ${{ github.token }}

outputs:
  archive:
    description: 'Absolute path to the built archive'
    value: ${{ steps.build.outputs.archive }}
  archive-name:
    description: 'File name of the built archive'
    value: ${{ steps.build.outputs.archive-name }}
  version:
    description: 'Version that has been built, "dev" for a nightly'
    value: ${{ steps.mode.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Set mode
      id: mode
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$VERSION" ]; then
          echo "mode=nightly" >> $GITHUB_OUTPUT
          echo "version=dev" >> $GITHUB_OUTPUT
        else
          echo "mode=tag" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi

    # Unconditionally: in tag mode the worktree is the default branch while the
    # archive is built from the tag's tree, so the worktree cannot tell whether
    # the archive will need Composer.
    - name: PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.php-extensions }}
        tools: composer:v2
        coverage: none

    # bin/release reads the tag through GitPython, which needs the tag object
    # itself: a lightweight tag has none. And the version it is asked to build
    # has to be the one the tagged _define.php declares, or the archive would
    # announce itself as something else.
    #
    # After the PHP step, because read-define.php replaces the regex this used to
    # run: plugin-legalnotices passes its arguments positionally and carries no
    # trailing comments at all, so anchoring on "//Version" read nothing there and
    # would have failed its very first release.
    - name: Check the tag
      if: steps.mode.outputs.mode == 'tag'
      shell: bash
      env:
        TAG: ${{ inputs.version }}
        READER: ${{ github.action_path }}/read-define.php
      run: |
        set -euo pipefail
        type=$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || echo missing)
        if [ "$type" != "tag" ]; then
          echo "::error::${TAG} is not an annotated tag in this checkout (got '${type}')"
          exit 1
        fi
        git show "${TAG}:_define.php" > "${RUNNER_TEMP}/_define.php"
        defined=$(php "$READER" "${RUNNER_TEMP}/_define.php" | jq -r '.version // empty')
        if [ -z "$defined" ]; then
          echo "::error::could not read the version from _define.php at ${TAG}"
          exit 1
        fi
        if [ "$defined" != "$TAG" ]; then
          echo "::error::trying to release ${TAG}, but the bumped version is ${defined}!"
          exit 1
        fi
        echo "_define.php declares ${defined}, as expected."

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: "${{ runner.os }}-composer-${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}"
        restore-keys: |
          ${{ runner.os }}-composer-${{ inputs.php-version }}-
          ${{ runner.os }}-composer-

    # Deliberately not actions/setup-python: it puts another interpreter first
    # on PATH, and bin/release would then run without these two modules.
    - name: Python dependencies for bin/release
      shell: bash
      run: python3 -m pip install --user --quiet --disable-pip-version-check GitPython termcolor

    # -l -d <dir> is what keeps the build off ssh.galette.eu: in local mode the
    # "does this release already exist?" check reads that directory and the
    # upload becomes a copy into it.
    - name: Build the archive
      id: build
      shell: bash
      env:
        MODE: ${{ steps.mode.outputs.mode }}
        TAG: ${{ inputs.version }}
        OUTDIR: ${{ runner.temp }}/plugin-release
      run: |
        set -euo pipefail
        mkdir -p "$OUTDIR"
        if [ "$MODE" = "nightly" ]; then
          python3 bin/release -V -n -l -d "$OUTDIR"
        else
          python3 bin/release -V -Y --no-sign -l -d "$OUTDIR" -v "$TAG"
        fi

        # bin/release ignores the exit code of every subprocess it runs, so a
        # failed composer install yields an archive without vendor/ and a happy
        # exit status. The archive is the only thing worth believing.
        mapfile -t archives < <(find "$OUTDIR" -maxdepth 1 -type f -name '*.tar.bz2')
        if [ "${#archives[@]}" -ne 1 ]; then
          echo "::error::expected exactly one archive in ${OUTDIR}, found ${#archives[@]}"
          exit 1
        fi
        archive="${archives[0]}"
        name=$(basename "$archive")
        prefix="${name%.tar.bz2}"
        entries=$(tar -tjf "$archive")
        if ! grep -qx "${prefix}/_define.php" <<< "$entries"; then
          echo "::error::${name} carries no ${prefix}/_define.php, this is not a plugin archive"
          exit 1
        fi
        if grep -qx "${prefix}/composer.json" <<< "$entries" \
           && ! grep -qx "${prefix}/vendor/autoload.php" <<< "$entries"; then
          echo "::error::composer install failed: no ${prefix}/vendor/autoload.php in ${name}"
          exit 1
        fi
        echo "archive=$archive" >> "$GITHUB_OUTPUT"
        echo "archive-name=$name" >> "$GITHUB_OUTPUT"
        ls -lh "$archive"

    # Replaces the detached GPG signature galette.eu used to serve: it ties the
    # archive to the repository, the workflow and the commit that built it,
    # without a private key living anywhere. Verify a download with
    # `gh attestation verify <archive> --repo <owner>/<repo>`.
    - name: Attest build provenance
      if: inputs.attest == 'true' && inputs.dry-run != 'true'
      uses: actions/attest@v4
      with:
        subject-path: ${{ steps.build.outputs.archive }}

    - name: Upload the archive as an artifact
      if: inputs.dry-run == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.archive-name }}
        path: ${{ steps.build.outputs.archive }}
        if-no-files-found: error
        retention-days: 7

    - name: Publish the release
      if: steps.mode.outputs.mode == 'tag' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ inputs.version }}
        ARCHIVE: ${{ steps.build.outputs.archive }}
      run: |
        set -euo pipefail
        # A maintainer may have created the release by hand right after pushing
        # the tag; refresh its asset rather than failing on a 422.
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          if [ "$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.immutable // false')" = "true" ]; then
            echo "::error::release ${TAG} already exists and is immutable, its asset cannot be replaced. Attach ${ARCHIVE##*/} by hand, or delete the release and re-run this workflow."
            exit 1
          fi
          echo "Release ${TAG} already exists, refreshing its asset."
          # gh's own error is left to speak for itself; this only says what it
          # may mean. Add to the list as other causes turn up.
          gh release upload "$TAG" "$ARCHIVE" --clobber --repo "$REPO" || {
            echo "::error::could not attach ${ARCHIVE##*/} to release ${TAG}, see the error above. It may mean the release is immutable and its assets can no longer be replaced."
            exit 1
          }
        else
          # --notes-from-tag would be useless here: plugin tag annotations only
          # repeat the version number.
          gh release create "$TAG" "$ARCHIVE" \
            --repo "$REPO" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes || {
            echo "::error::could not create release ${TAG}, see the error above. It may mean the tag is missing on the remote (--verify-tag), or that a release already exists for it."
            exit 1
          }
        fi

    # The plugin page names the Galette version the release targets, and can only
    # read it from a file on its own Pages branch — Jekyll on Pages runs in safe
    # mode, so it reaches neither another branch nor the network. That value used
    # to be `plugin.min_galette`, kept by hand in the site's _config.yml — and
    # eight of the eleven sites had it wrong, all in the same way: the number was
    # copied from `develop`, which declares the generation being prepared, while
    # the link beside it points at a release declaring the previous one. It is
    # `compver` in _define.php, so it is read from the tag that was released.
    #
    # `compver` is the Galette generation the build targets, not an open floor:
    # Plugins::register() disables a plugin whose compver is LOWER than the
    # running Galette's GALETTE_COMPAT_VERSION, and imposes no upper bound.
    #
    # Nothing equivalent runs in nightly mode: a nightly requires a nightly, so
    # the page labels it as such, and this would commit every night.
    - name: Publish the targeted Galette version to the plugin page
      if: steps.mode.outputs.mode == 'tag' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ inputs.version }}
        READER: ${{ github.action_path }}/read-define.php
      run: |
        set -uo pipefail

        # Only ever the release the cartouche actually links. Step 4b of
        # MIGRATE_PLUGINS.md republishes the whole back catalogue with
        # --latest=false, and an old version being re-uploaded must not rewrite
        # the page with the generation it targeted years ago.
        latest=$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name' 2>/dev/null)
        if [ "${latest:-}" != "$TAG" ]; then
          echo "${TAG} is not releases/latest (${latest:-none}), so the page keeps naming the Galette version of the release it links."
          exit 0
        fi

        # The tag's tree, not the worktree: the worktree is the default branch,
        # which may already have moved past the release being published.
        define="${RUNNER_TEMP}/_define.php"
        if ! git show "${TAG}:_define.php" > "$define"; then
          echo "::warning::could not read _define.php at ${TAG}, so the page keeps whatever Galette version it already names"
          exit 0
        fi

        if ! meta=$(php "$READER" "$define"); then
          echo "::warning::could not read the metadata of _define.php at ${TAG}, see the error above, so the page keeps whatever Galette version it already names"
          exit 0
        fi

        compver=$(printf '%s' "$meta" | jq -r '.compver // empty')
        if [ -z "$compver" ]; then
          echo "::warning::_define.php at ${TAG} declares no compver, so the page names no Galette version. Galette itself refuses to load a plugin without one, see Plugins::register()."
          exit 0
        fi

        # The page shows a generation, "1.2", not "1.2.0": that is what compver
        # means, and one number fewer to read. cut leaves a two-part value alone,
        # so "1.2" stays "1.2".
        series=$(printf '%s' "$compver" | cut -d. -f1,2)

        # Liquid cannot compare versions, so the page compares integers. Padded
        # so the order is right whatever the numbers: 1.2.0 -> 1002000, and
        # 1.10.0 -> 1010000, which a naive concatenation would sort below 1.2.0.
        rank=$(printf '%s' "$compver" | awk -F. '{printf "%d", $1 * 1000000 + $2 * 1000 + $3}')
        if [ -z "$rank" ] || [ "$rank" = "0" ]; then
          echo "::warning::compver ${compver} at ${TAG} is not a version this can rank, so the page will name it without a compatibility verdict"
          rank=''
        fi

        # The Pages branch is not always gh-pages — stripe, legalnotices and
        # helloasso publish from gh-pages-galette-theme — and the source may be a
        # subdirectory, so both are read rather than assumed. Same discovery as
        # theme-ghpages' bin/rebuild-consumers.
        pages=$(gh api "repos/${REPO}/pages" 2>/dev/null)
        branch=$(printf '%s' "$pages" | jq -r '.source.branch // empty')
        dir=$(printf '%s' "$pages" | jq -r '.source.path // "/"')
        if [ -z "$branch" ]; then
          echo "::warning::${REPO} publishes no page from a branch, so there is nowhere to write the Galette version it targets"
          exit 0
        fi
        prefix=''
        [ "$dir" != "/" ] && prefix="${dir#/}/"

        # Only a site built on this theme reads _data/galette.yml; anywhere else
        # it would just be a stray file nobody looks at. Several repositories
        # still carry a pre-migration gh-pages branch beside the real one, and
        # the Pages source is not always the branch you would guess.
        config=$(gh api "repos/${REPO}/contents/${prefix}_config.yml?ref=${branch}" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null)
        if ! printf '%s' "${config:-}" | grep -q 'remote_theme:.*galette/theme-ghpages'; then
          echo "The page of ${REPO} on ${branch} is not built on galette/theme-ghpages; leaving it alone."
          exit 0
        fi

        path="${prefix}_data/galette.yml"

        # Written line by line rather than with a heredoc: the delimiter of one
        # would have to sit at the start of a line, which this indented block
        # scalar cannot offer.
        out="${RUNNER_TEMP}/galette.yml"
        {
          echo '# GENERATED at each release by galette/.github/actions/release-plugin, from'
          echo '# `compver` in _define.php at the released tag. Do not edit it: the next'
          echo '# release overwrites it.'
          echo '#'
          echo '# `compver` is the Galette generation this release targets, not a floor with'
          echo '# no ceiling: Galette disables a plugin whose compver is lower than its own'
          echo '# GALETTE_COMPAT_VERSION. So the page reads "Compatible Galette '"${series}"'",'
          echo '# and the generation after that one refuses this release.'
          echo '#'
          echo '# `release` is what the theme checks the rest against: it ignores these'
          echo '# values unless they describe the release the download cartouche names.'
          echo '#'
          echo '# `rank` is compver packed into an integer, because Liquid has no version'
          echo '# comparison. The page shows a verdict only on a value it can rank, so an'
          echo '# unrankable compver is published without one rather than judged wrongly.'
          echo "release: \"${TAG}\""
          echo "compver: \"${compver}\""
          echo "series: \"${series}\""
          if [ -n "$rank" ]; then
            echo "rank: ${rank}"
          fi
        } > "$out"

        current=$(gh api "repos/${REPO}/contents/${path}?ref=${branch}" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null)
        if [ "$current" = "$(cat "$out")" ]; then
          echo "${path} on ${branch} already names Galette ${series} for ${TAG}, nothing to commit."
          exit 0
        fi

        # Through the contents API rather than a checkout: the worktree is on
        # another ref and the archive was built from it, so it is left alone.
        # Only ever _data/ — Weblate owns the pages themselves on this branch.
        args=(-f "message=Name the Galette version ${TAG} targets"
              -f "content=$(base64 -w0 < "$out")"
              -f "branch=${branch}")
        sha=$(gh api "repos/${REPO}/contents/${path}?ref=${branch}" --jq '.sha' 2>/dev/null)
        if [ -n "${sha:-}" ]; then
          args+=(-f "sha=${sha}")
        fi
        if ! gh api --method PUT "repos/${REPO}/contents/${path}" "${args[@]}" --silent; then
          echo "::warning::could not write ${path} on ${branch} of ${REPO}, see the error above. It may mean the calling workflow was not granted contents: write, or that a ruleset protects the branch. The page will keep naming whatever Galette version it already had."
          exit 0
        fi
        echo "${path} on ${branch} now names Galette ${series} for ${TAG}."

    # A plugin page shows no version of its own: it reads the latest release when
    # GitHub Pages builds it. Nothing else would ask for that build, so the page
    # would keep announcing the previous release until its next commit. Only tag
    # mode needs this — a nightly URL never changes.
    - name: Rebuild the plugin page
      if: steps.mode.outputs.mode == 'tag' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # Legitimately absent, or served from a workflow rather than a branch, in
        # which case there is no build to request.
        gh api --method POST "repos/${REPO}/pages/builds" --silent || {
          echo "::warning::could not request a GitHub Pages build for ${REPO}, see the error above. It may mean the repository publishes no page, or publishes it from a workflow rather than a branch. If it has one, its download link will keep naming the previous release until it is rebuilt."
        }

    # One rolling prerelease whose asset and notes are replaced every night, so
    # watchers are notified once and never again. Being a prerelease, it is
    # excluded from releases/latest, and the plugin page keeps showing the
    # stable version.
    - name: Publish the nightly
      if: steps.mode.outputs.mode == 'nightly' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ inputs.nightly-branch }}
        TAG: ${{ inputs.nightly-tag }}
        ARCHIVE: ${{ steps.build.outputs.archive }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        # The tag follows the built commit, so the release page's source links and
        # the compare link GitHub puts at the end of generated notes both point at
        # what was actually built. Pushed with GITHUB_TOKEN, which starts no
        # workflow run and notifies nobody.
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git tag --force --annotate "$TAG" --message "Nightly build $(date -u '+%Y-%m-%d')" "$SHA"
        # Not fatal: whatever refuses the tag, a nightly is still worth publishing
        # without its source links being exact.
        git push --force origin "refs/tags/${TAG}" || {
          echo "::warning::could not move the ${TAG} tag, see the error above. It may mean a ruleset restricts tag creation or updates on ${REPO}, or that the name once belonged to an immutable release that was deleted. The release is still published; its source links and the compare link at the end of its notes will point at whichever commit the tag already had."
        }

        header=$(printf 'Automatic build of the `%s` branch, rebuilt every night. Not meant for production use.\n\nCommit: %s\nBuilt: %s UTC' \
          "$BRANCH" "$SHA" "$(date -u '+%Y-%m-%d %H:%M')")

        # What the nightly carries over the last stable release. previous_tag is
        # passed explicitly: left to itself GitHub would take the most recent
        # release, which is the nightly itself, and produce nothing.
        previous_tag=$(gh release list --repo "$REPO" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty' || true)
        changelog=''
        if [ -n "$previous_tag" ]; then
          changelog=$(gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$SHA" \
            -f previous_tag_name="$previous_tag" \
            --jq '.body' || true)
        fi
        if [ -n "$changelog" ]; then
          notes=$(printf '%s\n\n%s' "$header" "$changelog")
        else
          notes="$header"
        fi
        if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$BRANCH" \
            --prerelease \
            --title 'Nightly build' \
            --notes "$notes"
        fi

        # Checked on the release rather than left to fail on the upload: the API
        # answers a bare "Cannot upload assets to an immutable release", which
        # says nothing about what to do. The check also covers the release this
        # run just created, so the problem surfaces tonight and not tomorrow.
        if [ "$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.immutable // false')" = "true" ]; then
          echo "::error::the ${TAG} release is immutable, so its archive cannot be replaced every night. Turn immutable releases off for ${REPO}, then delete the ${TAG} release and its tag before re-running. Note that deleting an immutable release burns its tag name for good, and nightly-tag then has to name another one."
          exit 1
        fi

        gh release upload "$TAG" "$ARCHIVE" --clobber --repo "$REPO" || {
          echo "::error::could not attach ${ARCHIVE##*/} to the ${TAG} release, see the error above. It may mean the release became immutable since it was created."
          exit 1
        }
        gh release edit "$TAG" --repo "$REPO" --notes "$notes"
