name: 'Release a Galette plugin'
description: 'Build a plugin archive with its own bin/release and publish it as a GitHub release'
author: 'Galette Team'

inputs:
  version:
    description: 'Tag to release. Leave empty to build a nightly instead.'
    required: false
    default: ''
  nightly-branch:
    description: 'Branch a nightly is built from. bin/release -n reads the local develop branch, so a plugin living on another branch needs it aliased to develop after checkout.'
    required: false
    default: 'develop'
  php-version:
    description: 'PHP version used to install the plugin Composer dependencies'
    required: false
    default: '8.3'
  php-extensions:
    description: 'PHP extensions needed to install the plugin Composer dependencies'
    required: false
    default: 'sodium'
  attest:
    description: 'Attach a signed build provenance attestation to the archive'
    required: false
    default: 'true'
  dry-run:
    description: 'Build the archive and upload it as a workflow artifact, publish nothing'
    required: false
    default: 'false'
  token:
    description: 'Token used to publish the release'
    required: false
    default: ${{ github.token }}

outputs:
  archive:
    description: 'Absolute path to the built archive'
    value: ${{ steps.build.outputs.archive }}
  archive-name:
    description: 'File name of the built archive'
    value: ${{ steps.build.outputs.archive-name }}
  version:
    description: 'Version that has been built, "dev" for a nightly'
    value: ${{ steps.mode.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Set mode
      id: mode
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$VERSION" ]; then
          echo "mode=nightly" >> $GITHUB_OUTPUT
          echo "version=dev" >> $GITHUB_OUTPUT
        else
          echo "mode=tag" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi

    # bin/release reads the tag through GitPython, which needs the tag object
    # itself: a lightweight tag has none. And the version it is asked to build
    # has to be the one the tagged _define.php declares, or the archive would
    # announce itself as something else.
    - name: Check the tag
      if: steps.mode.outputs.mode == 'tag'
      shell: bash
      env:
        TAG: ${{ inputs.version }}
      run: |
        set -euo pipefail
        type=$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || echo missing)
        if [ "$type" != "tag" ]; then
          echo "::error::${TAG} is not an annotated tag in this checkout (got '${type}')"
          exit 1
        fi
        # Both argument styles are in the wild: "'2.2.0', //Version" on older
        # tags, "version: '2.2.0', //Version" on current ones.
        defined=$(git show "${TAG}:_define.php" \
          | sed -nE "s@^[[:space:]]*(version:[[:space:]]*)?'([^']+)',?[[:space:]]*//[[:space:]]*Version[[:space:]]*\$@\2@p" \
          | head -n1)
        if [ -z "$defined" ]; then
          echo "::error::could not read the version from _define.php at ${TAG}"
          exit 1
        fi
        if [ "$defined" != "$TAG" ]; then
          echo "::error::trying to release ${TAG}, but the bumped version is ${defined}!"
          exit 1
        fi
        echo "_define.php declares ${defined}, as expected."

    # Unconditionally: in tag mode the worktree is the default branch while the
    # archive is built from the tag's tree, so the worktree cannot tell whether
    # the archive will need Composer.
    - name: PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.php-extensions }}
        tools: composer:v2
        coverage: none

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: "${{ runner.os }}-composer-${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}"
        restore-keys: |
          ${{ runner.os }}-composer-${{ inputs.php-version }}-
          ${{ runner.os }}-composer-

    # Deliberately not actions/setup-python: it puts another interpreter first
    # on PATH, and bin/release would then run without these two modules.
    - name: Python dependencies for bin/release
      shell: bash
      run: python3 -m pip install --user --quiet --disable-pip-version-check GitPython termcolor

    # -l -d <dir> is what keeps the build off ssh.galette.eu: in local mode the
    # "does this release already exist?" check reads that directory and the
    # upload becomes a copy into it.
    - name: Build the archive
      id: build
      shell: bash
      env:
        MODE: ${{ steps.mode.outputs.mode }}
        TAG: ${{ inputs.version }}
        OUTDIR: ${{ runner.temp }}/plugin-release
      run: |
        set -euo pipefail
        mkdir -p "$OUTDIR"
        if [ "$MODE" = "nightly" ]; then
          python3 bin/release -V -n -l -d "$OUTDIR"
        else
          python3 bin/release -V -Y --no-sign -l -d "$OUTDIR" -v "$TAG"
        fi

        # bin/release ignores the exit code of every subprocess it runs, so a
        # failed composer install yields an archive without vendor/ and a happy
        # exit status. The archive is the only thing worth believing.
        mapfile -t archives < <(find "$OUTDIR" -maxdepth 1 -type f -name '*.tar.bz2')
        if [ "${#archives[@]}" -ne 1 ]; then
          echo "::error::expected exactly one archive in ${OUTDIR}, found ${#archives[@]}"
          exit 1
        fi
        archive="${archives[0]}"
        name=$(basename "$archive")
        prefix="${name%.tar.bz2}"
        entries=$(tar -tjf "$archive")
        if ! grep -qx "${prefix}/_define.php" <<< "$entries"; then
          echo "::error::${name} carries no ${prefix}/_define.php, this is not a plugin archive"
          exit 1
        fi
        if grep -qx "${prefix}/composer.json" <<< "$entries" \
           && ! grep -qx "${prefix}/vendor/autoload.php" <<< "$entries"; then
          echo "::error::composer install failed: no ${prefix}/vendor/autoload.php in ${name}"
          exit 1
        fi
        echo "archive=$archive" >> "$GITHUB_OUTPUT"
        echo "archive-name=$name" >> "$GITHUB_OUTPUT"
        ls -lh "$archive"

    # Replaces the detached GPG signature galette.eu used to serve: it ties the
    # archive to the repository, the workflow and the commit that built it,
    # without a private key living anywhere. Verify a download with
    # `gh attestation verify <archive> --repo <owner>/<repo>`.
    - name: Attest build provenance
      if: inputs.attest == 'true' && inputs.dry-run != 'true'
      uses: actions/attest@v4
      with:
        subject-path: ${{ steps.build.outputs.archive }}

    - name: Upload the archive as an artifact
      if: inputs.dry-run == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.archive-name }}
        path: ${{ steps.build.outputs.archive }}
        if-no-files-found: error
        retention-days: 7

    - name: Publish the release
      if: steps.mode.outputs.mode == 'tag' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ inputs.version }}
        ARCHIVE: ${{ steps.build.outputs.archive }}
      run: |
        set -euo pipefail
        # A maintainer may have created the release by hand right after pushing
        # the tag; refresh its asset rather than failing on a 422.
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          if [ "$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.immutable // false')" = "true" ]; then
            echo "::error::release ${TAG} already exists and is immutable, its asset cannot be replaced. Attach ${ARCHIVE##*/} by hand, or delete the release and re-run this workflow."
            exit 1
          fi
          echo "Release ${TAG} already exists, refreshing its asset."
          # gh's own error is left to speak for itself; this only says what it
          # may mean. Add to the list as other causes turn up.
          gh release upload "$TAG" "$ARCHIVE" --clobber --repo "$REPO" || {
            echo "::error::could not attach ${ARCHIVE##*/} to release ${TAG}, see the error above. It may mean the release is immutable and its assets can no longer be replaced."
            exit 1
          }
        else
          # --notes-from-tag would be useless here: plugin tag annotations only
          # repeat the version number.
          gh release create "$TAG" "$ARCHIVE" \
            --repo "$REPO" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes || {
            echo "::error::could not create release ${TAG}, see the error above. It may mean the tag is missing on the remote (--verify-tag), or that a release already exists for it."
            exit 1
          }
        fi

    # One rolling prerelease whose asset and notes are replaced every night, so
    # watchers are notified once and never again. Being a prerelease, it is
    # excluded from releases/latest, and the plugin page keeps showing the
    # stable version.
    - name: Publish the nightly
      if: steps.mode.outputs.mode == 'nightly' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ inputs.nightly-branch }}
        ARCHIVE: ${{ steps.build.outputs.archive }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        # The tag follows the built commit, so the release page's source links and
        # the compare link GitHub puts at the end of generated notes both point at
        # what was actually built. Pushed with GITHUB_TOKEN, which starts no
        # workflow run and notifies nobody.
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git tag --force --annotate nightly --message "Nightly build $(date -u '+%Y-%m-%d')" "$SHA"
        # Not fatal: a ruleset restricting tag pushes is a legitimate setup, and a
        # nightly is still worth publishing without its source links being exact.
        git push --force origin refs/tags/nightly || {
          echo "::warning::could not move the nightly tag, see the error above. It may mean a ruleset restricts tag creation or updates on ${REPO}. The release is still published; its source links and the compare link at the end of its notes will point at whichever commit the tag already had."
        }

        header=$(printf 'Automatic build of the `%s` branch, rebuilt every night. Not meant for production use.\n\nCommit: %s\nBuilt: %s UTC' \
          "$BRANCH" "$SHA" "$(date -u '+%Y-%m-%d %H:%M')")

        # What the nightly carries over the last stable release. previous_tag is
        # passed explicitly: left to itself GitHub would take the most recent
        # release, which is the nightly itself, and produce nothing.
        previous_tag=$(gh release list --repo "$REPO" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty' || true)
        changelog=''
        if [ -n "$previous_tag" ]; then
          changelog=$(gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name=nightly \
            -f target_commitish="$SHA" \
            -f previous_tag_name="$previous_tag" \
            --jq '.body' || true)
        fi
        if [ -n "$changelog" ]; then
          notes=$(printf '%s\n\n%s' "$header" "$changelog")
        else
          notes="$header"
        fi
        if ! gh release view nightly --repo "$REPO" >/dev/null 2>&1; then
          gh release create nightly \
            --repo "$REPO" \
            --target "$BRANCH" \
            --prerelease \
            --title 'Nightly build' \
            --notes "$notes"
        fi

        # Checked on the release rather than left to fail on the upload: the API
        # answers a bare "Cannot upload assets to an immutable release", which
        # says nothing about what to do. The check also covers the release this
        # run just created, so the problem surfaces tonight and not tomorrow.
        if [ "$(gh api "repos/${REPO}/releases/tags/nightly" --jq '.immutable // false')" = "true" ]; then
          echo "::error::the nightly release is immutable, so its archive cannot be replaced every night. Turn immutable releases off for ${REPO}, then delete the nightly release and its tag before re-running."
          exit 1
        fi

        gh release upload nightly "$ARCHIVE" --clobber --repo "$REPO" || {
          echo "::error::could not attach ${ARCHIVE##*/} to the nightly release, see the error above. It may mean the release became immutable since it was created."
          exit 1
        }
        gh release edit nightly --repo "$REPO" --notes "$notes"
